<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gitnova Dashboard</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="toolbar">
        <h1>Gitnova</h1>
        <form id="search-form">
          <input id="query" name="query" type="search" value="architecture" />
          <button type="submit">Search</button>
        </form>
      </section>
      <section class="graph-panel" aria-label="Graph">
        <div class="section-heading">
          <h2>Graph</h2>
          <span id="graph-count"></span>
        </div>
        <div class="graph-controls">
          <input id="graph-filter" type="search" placeholder="Filter nodes" />
          <select id="graph-kind" aria-label="Node kind">
            <option value="">All kinds</option>
            <option value="file">Files</option>
            <option value="module">Modules</option>
            <option value="function">Functions</option>
            <option value="method">Methods</option>
            <option value="class">Classes</option>
            <option value="struct">Structs</option>
            <option value="interface">Interfaces</option>
            <option value="trait">Traits</option>
          </select>
          <button id="graph-zoom-in" type="button">+</button>
          <button id="graph-zoom-out" type="button">-</button>
          <button id="graph-reset" type="button">Reset</button>
        </div>
        <canvas id="graph-canvas" width="900" height="420"></canvas>
      </section>
      <section class="grid">
        <div>
          <h2>Summary</h2>
          <pre id="summary"></pre>
          <h2>Hubs</h2>
          <ul id="hubs"></ul>
        </div>
        <div>
          <h2>Ranked Results</h2>
          <ol id="results"></ol>
          <h2>Node Detail</h2>
          <pre id="detail"></pre>
        </div>
      </section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
